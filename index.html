<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <title>NEO — Orbital Navigation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="This innovative navigation system enhances user experience by providing an interactive, scroll-driven interface that visually guides users through website pages."
    />

    <!-- Unreleased site: keep it out of search indexes. Remove this and the
         Disallow in public/robots.txt when going public. -->

      property="og:description"
      content="An interactive, scroll-driven orbital navigation system."

    <!-- Preload the two faces used above the fold, so the intro animation
         doesn't start against a fallback font. -->
    <link
      rel="preload"
      href="/fonts/FAIRE_Sprig_Sans_Trial-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Inter-Variable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <div id="root"></div>
